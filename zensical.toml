    "part5-sensors/5-4-line.md",
    "part5-sensors/5-5-ball-hold.md",
    "part5-sensors/5-6-imu.md",
    "part5-sensors/5-7-camera.md",
  ] },
  { "第6部 モータ" = [
    "part6-motors/index.md",
    "part6-motors/6-1-dc-motor.md",
    "part6-motors/6-2-h-bridge.md",
    "part6-motors/6-3-pwm.md",
    "part6-motors/6-4-noise.md",
    "part6-motors/6-5-motor-board.md",
    "part6-motors/6-6-dribbler.md",
