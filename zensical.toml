    "part2-kicad/2-1-project.md",
    "part2-kicad/2-2-schematic.md",
    "part2-kicad/2-3-footprint.md",
    "part2-kicad/2-4-layout.md",
    "part2-kicad/2-5-drc.md",
    "part2-kicad/2-6-output.md",
    "part2-kicad/2-7-practice.md",
  ] },
  { "第3部 電源" = [
    "part3-power/index.md",
    "part3-power/3-1-battery.md",
    "part3-power/3-2-current.md",
    "part3-power/3-3-protection.md",
    "part3-power/3-4-regulator.md",
