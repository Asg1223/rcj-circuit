    "part8-system/8-1-split.md",
    "part8-system/8-2-bus.md",
    "part8-system/8-3-harness.md",
    "part8-system/8-4-layout.md",
  ] },
  { "第9部 発注・実装・検査" = [
    "part9-build/index.md",
    "part9-build/9-1-order.md",
    "part9-build/9-2-solder.md",
    "part9-build/9-3-first-power.md",
    "part9-build/9-4-debug.md",
    "part9-build/9-5-inspection.md",
