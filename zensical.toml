    "part1-basics/1-1-ohm.md",
    "part1-basics/1-2-divider.md",
    "part1-basics/1-3-capacitor.md",
    "part1-basics/1-4-diode-led.md",
    "part1-basics/1-5-mosfet.md",
    "part1-basics/1-6-datasheet.md",
    "part1-basics/1-7-spice.md",
  ] },
  { "第2部 KiCad 入門" = [
