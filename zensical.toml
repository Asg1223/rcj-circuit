[project]
site_name = "RCJ サッカーの電子回路設計"
site_description = "ロボカップジュニア サッカー（インフラレッド）のロボットの電子回路を、KiCad で回路図から基板の発注まで設計できるようになるための教材"
site_author = "Asg1223"
site_url = "https://asg1223.github.io/rcj-circuit/"
repo_url = "https://github.com/Asg1223/rcj-circuit"
repo_name = "Asg1223/rcj-circuit"
copyright = "Copyright &copy; 2026 Asg1223 — MIT License"

nav = [
  { "はじめに" = "index.md" },
  { "第0部 はじめに" = [
    "part0-intro/index.md",
    "part0-intro/0-1-overview.md",
    "part0-intro/0-2-rules.md",
    "part0-intro/0-3-tools.md",
    "part0-intro/0-4-safety.md",
  ] },
