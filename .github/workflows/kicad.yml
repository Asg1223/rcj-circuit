# 教材用 KiCad プロジェクトの自動チェック
#   ERC（回路図）と DRC（基板）を KiCad 10 で走らせ、
#   ガーバー・ドリル・回路図 PDF を「Artifacts」として置く（リポジトリには入れない）
name: kicad

on:
  push:
    paths: ["kicad/**", ".github/workflows/kicad.yml"]
  pull_request:
    paths: ["kicad/**"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: ERC・DRC・製造データの書き出し
        shell: bash
        run: |
          set -u
          mkdir -p out
          status=0
          while read -r line; do
            proj="${line%%#*}"; proj="$(echo "$proj" | xargs)"
            [ -z "$proj" ] && continue
            dir="kicad/$proj"
            echo "::group::$proj"
            # ERC：エラーだけで止める（警告は表示だけ）
            if ! kicad-cli sch erc --severity-error --exit-code-violations \
                 --format json -o "out/$proj-erc.json" "$dir/$proj.kicad_sch"; then
              echo "::error::$proj の ERC でエラーが出ました（out/$proj-erc.json を見てください）"
              status=1
            fi
            # DRC：回路図と基板のくいちがい（parity）も調べる
            if ! kicad-cli pcb drc --severity-error --exit-code-violations --schematic-parity \
                 --format json -o "out/$proj-drc.json" "$dir/$proj.kicad_pcb"; then
              echo "::error::$proj の DRC でエラーが出ました（out/$proj-drc.json を見てください）"
              status=1
            fi
            mkdir -p "out/$proj/gerbers"
            kicad-cli pcb export gerbers -o "out/$proj/gerbers/" "$dir/$proj.kicad_pcb"
            kicad-cli pcb export drill -o "out/$proj/gerbers/" "$dir/$proj.kicad_pcb"
            kicad-cli sch export pdf -o "out/$proj/$proj-schematic.pdf" "$dir/$proj.kicad_sch"
            kicad-cli sch export bom -o "out/$proj/$proj-bom.csv" "$dir/$proj.kicad_sch" || true
            echo "::endgroup::"
          done < kicad/projects.txt
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kicad-outputs
          path: out/
